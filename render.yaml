services:
  - type: web
    name: mediq-api
    runtime: node
    plan: free
    buildCommand: npm install && npm --prefix server run prisma:generate
    startCommand: npm --prefix server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
